# ==========================================
# RACCORD - stack completo (db + backend + frontend)
# ==========================================
# Un solo comando levanta todo:
#
#   docker compose up -d --build
#
# IMPORTANTE (una sola vez, antes del primer "docker compose up"):
# ya tienes "postgres-db" y "adminer" corriendo como contenedores
# sueltos (creados con "docker run"). Compose va a crear contenedores
# nuevos con esos mismos nombres apuntando al MISMO volumen de datos,
# así que hay que quitar los sueltos primero para que no choquen:
#
#   docker rm -f postgres-db adminer
#
# El volumen de datos (postgres_data, abajo) NO se toca con ese
# comando - solo se borran los contenedores, los datos siguen intactos
# en el volumen.

services:
  db:
    image: postgres
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carlos.yaya
      POSTGRES_PASSWORD: "Nicolas2026*"
      POSTGRES_DB: raccord
    ports:
      - "5432:5432"
    volumes:
      # Mismo volumen que ya usa tu contenedor postgres-db actual
      # (visto con "docker inspect postgres-db"). Como ya tiene datos,
      # Postgres arranca usándolos tal cual - las variables de arriba
      # solo aplican si el volumen estuviera vacío.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carlos.yaya -d raccord"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  backend:
    build:
      context: ./raccord_backend/api_usuarios
    container_name: raccord-backend
    restart: unless-stopped
    env_file:
      - ./raccord_backend/api_usuarios/.env
    environment:
      # Dentro de la red de docker compose, el host de la BD es el
      # nombre del servicio ("db"), no localhost. Todo lo demás
      # (usuario, contraseña, SECRET_KEY, correo, etc.) sale del .env.
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./raccord_flutter
    container_name: raccord-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    external: true
    # Nombre real del volumen que ya tiene tus datos (visto con
    # "docker inspect postgres-db"). "external: true" le dice a
    # compose que NO cree un volumen nuevo, que use este que ya existe.
    name: afbf8ec9e0032afaa85fa6ec45ae734bbafde776efede1686bcdbc21addaf709
